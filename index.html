<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verteiler-Erfassung</title>
<meta name="theme-color" content="#34495e">
<meta name="description" content="Verteiler Bestandsaufnahme für Elektriker">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Verteiler">
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f4f6f9;color:#333;padding:15px;display:flex;justify-content:center}
.container{max-width:600px;width:100%;background:#fff;padding:16px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
h2{text-align:center;color:#2c3e50;margin-bottom:12px;padding-bottom:10px;border-bottom:3px solid #3498db;font-size:20px}
.section-title{background:#34495e;color:#fff;padding:10px 12px;border-radius:6px;margin:20px 0 12px;font-size:16px}
.subsection-title{font-weight:bold;color:#7f8c8d;margin:14px 0 5px;font-size:13px;text-transform:uppercase;border-bottom:1px dashed #ccc;padding-bottom:3px}
.form-group{margin-bottom:14px}
label{display:block;margin-bottom:5px;font-weight:bold;color:#555;font-size:14px}
select,input[type="text"]{width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:6px;font-size:15px;background:#fff}
.counter-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #eee}
.counter-label{font-size:14px;flex-grow:1;padding-right:10px}
.counter-controls{display:flex;align-items:center;gap:6px;flex-shrink:0}
.btn-count{width:38px;height:38px;background:#ebedf0;border:1px solid #ccd1d9;border-radius:6px;font-size:22px;font-weight:bold;cursor:pointer;display:flex;justify-content:center;align-items:center;line-height:1;user-select:none;-webkit-user-select:none}
.btn-count:active{background:#d1d5db}
.counter-val{width:52px;height:38px;text-align:center;font-size:15px;border:1px solid #ccc;border-radius:6px;background:#fff;font-family:inherit}
.counter-val::-webkit-outer-spin-button,.counter-val::-webkit-inner-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
.photo-container{background:#f8f9fa;border:2px dashed #bdc3c7;padding:14px;border-radius:6px;text-align:center;margin-top:8px;margin-bottom:14px}
.file-input-label{display:inline-block;background:#2c3e50;color:#fff;padding:12px 20px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:15px;box-shadow:0 2px 5px rgba(0,0,0,0.2)}
.preview-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(75px,1fr));gap:8px;margin-top:12px}
.preview-gallery img{width:100%;height:75px;object-fit:cover;border-radius:6px;box-shadow:0 2px 5px rgba(0,0,0,0.15)}
.summary-box{background:#eef9ff;border:2px solid #3498db;padding:14px;border-radius:6px;margin-top:22px}
.summary-box h3{margin:0 0 10px;color:#2980b9;font-size:15px}
pre{white-space:pre-wrap;background:#fff;padding:10px;border:1px solid #dcdde1;border-radius:4px;font-family:monospace;font-size:12px;line-height:1.5}
.btn-download{display:block;width:100%;padding:13px;background:#3498db;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer;margin-top:12px;margin-bottom:8px;text-align:center}
.btn-send{display:block;width:100%;padding:13px;background:#2ecc71;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer;text-align:center;text-decoration:none}
textarea{width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:6px;font-size:15px;background:#fff;font-family:inherit;resize:vertical;min-height:80px}
.pflicht{color:#e74c3c;margin-left:2px}
input.fehlt,textarea.fehlt{border-color:#e74c3c;background:#fff8f8}
.datum-anzeige{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:6px;font-size:15px;background:#f0f0f0;color:#555;display:block}
</style>
</head>
<body>
<div class="container">
  <h2>Verteiler-Bestandsaufnahme ⚡</h2>

  <div class="section-title">Stammdaten</div>
  <div class="form-group">
    <label>Datum der Aufnahme:</label>
    <span class="datum-anzeige" id="datum_anzeige"></span>
  </div>
  <div class="form-group">
    <label for="auftrags_nummer">Auftragsnummer <span class="pflicht">*</span></label>
    <input type="text" id="auftrags_nummer" placeholder="z.B. AN-2026-8941" oninput="aktualisiere()">
  </div>
  <div class="form-group">
    <label for="monteur_name">Monteur Name <span class="pflicht">*</span></label>
    <input type="text" id="monteur_name" placeholder="z.B. Max Mustermann" oninput="aktualisiere()">
  </div>
  <div class="form-group">
    <label for="projekt_name">Straße / Bauvorhaben <span class="pflicht">*</span></label>
    <input type="text" id="projekt_name" placeholder="z.B. Hauptstraße 12" oninput="aktualisiere()">
  </div>
  <div class="form-group">
    <label for="stadt">Stadt <span class="pflicht">*</span></label>
    <input type="text" id="stadt" placeholder="z.B. Pforzheim" oninput="aktualisiere()">
  </div>

  <div class="section-title">1. Unterverteilung (UV)</div>
  <div class="form-group">
    <label for="uv_reihen">Verteiler-Größe (Reihen):</label>
    <select id="uv_reihen" onchange="aktualisiere()">
      <option value="0">Keine UV (Nur Zählerfeld)</option>
      <option value="1">1-reihig</option>
      <option value="2">2-reihig</option>
      <option value="3" selected>3-reihig (Standard Wohnung)</option>
      <option value="4">4-reihig</option>
      <option value="5">5-reihig</option>
    </select>
  </div>
  <div id="uv_rows"></div>
  <div class="form-group" style="margin-top:14px">
    <label>Fotos von der Unterverteilung (UV):</label>
    <div class="photo-container">
      <label for="uv_foto_upload" class="file-input-label">📸 UV-Kamera öffnen</label>
      <input type="file" id="uv_foto_upload" accept="image/*" capture="environment" style="display:none" onchange="verarbeiteFotos(this,'UV')">
      <div id="uv_gallery" class="preview-gallery"></div>
    </div>
  </div>

  <div class="section-title">2. Zählerteilung (ZV)</div>
  <div class="subsection-title">Zähler &amp; Hauptkomponenten</div>
  <div class="form-group">
    <label for="zv_plaetze">Anzahl Zählerplätze:</label>
    <select id="zv_plaetze" onchange="aktualisiere()">
      <option value="0">Kein Zählerschrank (nur UV)</option>
      <option value="1" selected>1 Zählerplatz</option>
      <option value="2">2 Zählerplätze</option>
      <option value="3">3 Zählerplätze</option>
      <option value="4">4 Zählerplätze</option>
    </select>
  </div>
  <div class="form-group">
    <label for="zv_sls">SLS-Schalter Ausführung:</label>
    <select id="zv_sls" onchange="aktualisiere()">
      <option value="Kein">Kein SLS vorhanden</option>
      <option value="35A">3-polig 35 A</option>
      <option value="40A">3-polig 40 A</option>
      <option value="50A" selected>3-polig 50 A (Standard)</option>
      <option value="63A">3-polig 63 A</option>
    </select>
  </div>
  <div id="zv_rows_main"></div>

  <div class="subsection-title">Sicherungsfeld ZV</div>
  <div class="form-group">
    <label for="zv_reihen">Größe des integrierten Verteilerfelds:</label>
    <select id="zv_reihen" onchange="aktualisiere()">
      <option value="0">Kein separates Verteilerfeld</option>
      <option value="1">1 Reihe frei für Sicherungen</option>
      <option value="2" selected>2 Reihen frei (Standard Haustechnik)</option>
      <option value="3">3 Reihen frei</option>
    </select>
  </div>
  <div id="zv_rows_field"></div>

  <div class="form-group" style="margin-top:14px">
    <label>Fotos von der Zählerverteilung (ZV):</label>
    <div class="photo-container">
      <label for="zv_foto_upload" class="file-input-label">📸 ZV-Kamera öffnen</label>
      <input type="file" id="zv_foto_upload" accept="image/*" capture="environment" style="display:none" onchange="verarbeiteFotos(this,'ZV')">
      <div id="zv_gallery" class="preview-gallery"></div>
    </div>
  </div>

  <div class="section-title">Notizen</div>
  <div class="form-group">
    <label for="notizen">Bemerkungen / Besonderheiten:</label>
    <textarea id="notizen" placeholder="z.B. Verteiler stark veraltet, Kabel beschädigt, Rücksprache nötig ..." oninput="aktualisiere()"></textarea>
  </div>

  <div class="summary-box">
    <h3>Vorschau Materialliste für das Büro:</h3>
    <pre id="email_output">Wird berechnet...</pre>
    <button class="btn-download" type="button" onclick="stempelnUndHerunterladen()">📸 Gestempelte Fotos erzeugen &amp; herunterladen</button>
    <a id="btn_senden" href="#" class="btn-send">Materialliste an Büro senden ✉️</a>
  </div>
</div>

<script>
const FELDER = {
  uv: [
    {id:'uv_haupt',  label:'Hauptschalter / Lasttrennschalter (UV)', def:1},
    {id:'uv_spd',    label:'Überspannungsschutz (SPD Typ 2)', def:1},
    {id:'uv_fi4',    label:'FI-Schutzschalter (RCD) 4-polig', def:2},
    {id:'uv_fi2',    label:'FI-Schutzschalter (RCD) 2-polig', def:0},
    {id:'uv_rcbo',   label:'FI/LS Kombischalter (RCBO)', def:0},
    {id:'uv_b16_1p', label:'LS-Schalter B16 (1-polig)', def:12},
    {id:'uv_b16_3p', label:'LS-Schalter B16 (3-polig – Herd)', def:1},
    {id:'uv_b32_3p', label:'LS-Schalter B32 (3-polig)', def:0},
    {id:'uv_c_typ',  label:'LS-Schalter C16 / C32 (Träge)', def:0},
    {id:'uv_eltako', label:'Stromstoßschalter / Eltako', def:0},
    {id:'uv_treppen',label:'Treppenlicht-Zeitschalter', def:0}
  ],
  zv_main: [
    {id:'zv_spd',   label:'Kombi-Ableiter (SPD Typ 1+2 Sammelschiene)', def:1},
    {id:'zv_haupt', label:'Hauptschalter ZV (Hauptleitungs-Schalter)', def:1}
  ],
  zv_field: [
    {id:'zv_fi4',    label:'ZV: FI-Schutzschalter (RCD) 4-polig', def:1},
    {id:'zv_fi2',    label:'ZV: FI-Schutzschalter (RCD) 2-polig', def:0},
    {id:'zv_rcbo',   label:'ZV: FI/LS Kombischalter (RCBO)', def:0},
    {id:'zv_b16_1p', label:'ZV: LS-Schalter B16 (1-polig)', def:6},
    {id:'zv_b16_3p', label:'ZV: LS-Schalter B16 (3-polig)', def:1},
    {id:'zv_c_typ',  label:'ZV: LS-Schalter C16 / C32', def:0},
    {id:'zv_eltako', label:'ZV: Stromstoßschalter / Treppenlichtzeit', def:1}
  ]
};

function buildRows(containerId, felder) {
  const c = document.getElementById(containerId);
  c.innerHTML = felder.map(f => `
    <div class="counter-row">
      <div class="counter-label">${f.label}</div>
      <div class="counter-controls">
        <button class="btn-count" type="button" onclick="changeVal('${f.id}',-1)">−</button>
        <input type="number" id="${f.id}" value="${f.def}" class="counter-val" min="0" oninput="aktualisiere()">
        <button class="btn-count" type="button" onclick="changeVal('${f.id}',1)">+</button>
      </div>
    </div>`).join('');
}

function changeVal(id, delta) {
  const el = document.getElementById(id);
  if (!el) return;
  let v = (parseInt(el.value) || 0) + delta;
  if (v < 0) v = 0;
  el.value = v;
  aktualisiere();
}

function gv(id) { return parseInt(document.getElementById(id).value) || 0; }
function gs(id) { return document.getElementById(id).value; }

let filesUV = [], filesZV = [];

function verarbeiteFotos(input, typ) {
  if (!input.files || !input.files.length) return;
  const file = input.files[0];
  const gallery = document.getElementById(typ === 'UV' ? 'uv_gallery' : 'zv_gallery');
  if (typ === 'UV') filesUV.push(file); else filesZV.push(file);
  const img = document.createElement('img');
  img.src = URL.createObjectURL(file);
  gallery.appendChild(img);
  aktualisiere();
}

function erzeugeWasserzeichen(file, typ, index) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const im = new Image();
      im.onload = () => {
        const cv = document.createElement('canvas');
        cv.width = im.width; cv.height = im.height;
        const ctx = cv.getContext('2d');
        ctx.drawImage(im, 0, 0);
        const bv = document.getElementById('projekt_name').value || 'Ohne_Name';
        const an = document.getElementById('auftrags_nummer').value || 'Ohne_Nummer';
        const txt = `${bv} - ${an} - ${typ}_Foto_${index+1}`;
        const fs = Math.max(24, Math.floor(cv.width/25));
        ctx.font = `bold ${fs}px sans-serif`;
        const tw = ctx.measureText(txt).width;
        const pad = fs*0.5;
        const rx = cv.width - tw - pad*2 - 20, ry = cv.height - fs - pad*2 - 20;
        ctx.fillStyle = 'rgba(0,0,0,0.65)';
        ctx.fillRect(rx, ry, tw+pad*2, fs+pad*2);
        ctx.fillStyle = '#fff'; ctx.textBaseline = 'top';
        ctx.fillText(txt, rx+pad, ry+pad);
        resolve(cv.toDataURL('image/png'));
      };
      im.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function triggerDownload(url, name, delay) {
  setTimeout(() => {
    const a = document.createElement('a');
    a.href = url; a.download = name; a.target = '_blank';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }, delay);
}

async function stempelnUndHerunterladen() {
  if (!filesUV.length && !filesZV.length) { alert('Bitte zuerst Fotos aufnehmen.'); return; }
  const strasse = (document.getElementById('projekt_name').value||'Ohne_Adresse').replace(/[^a-zA-Z0-9\-_]/g,'_');
  const an = (document.getElementById('auftrags_nummer').value||'Ohne_Nummer').replace(/[^a-zA-Z0-9\-_]/g,'_');
  let i = 0;
  for (let j=0;j<filesUV.length;j++) { triggerDownload(await erzeugeWasserzeichen(filesUV[j],'UV',j),`${an}_${strasse}_UV_Foto_${j+1}.png`,i++*400); }
  for (let j=0;j<filesZV.length;j++) { triggerDownload(await erzeugeWasserzeichen(filesZV[j],'ZV',j),`${an}_${strasse}_ZV_Foto_${j+1}.png`,i++*400); }
}

function aktualisiere() {
  const an     = document.getElementById('auftrags_nummer').value || '';
  const monteur= document.getElementById('monteur_name').value || '';
  const strasse= document.getElementById('projekt_name').value || '';
  const stadt  = document.getElementById('stadt').value || '';
  const notizen= document.getElementById('notizen').value || '';
  const datum  = document.getElementById('datum_anzeige').textContent || '';
  const email  = 'ansgarseine@googlemail.com';

  // Pflichtfelder markieren
  ['auftrags_nummer','monteur_name','projekt_name','stadt'].forEach(id => {
    const el = document.getElementById(id);
    if(!el.value.trim()) el.classList.add('fehlt'); else el.classList.remove('fehlt');
  });

  const bv = strasse || 'Ohne Adresse';

  const uvR = parseInt(gs('uv_reihen'));
  const zvP = parseInt(gs('zv_plaetze'));
  const zvS = gs('zv_sls');
  const zvR = parseInt(gs('zv_reihen'));

  let uvAuto=[], zvAuto=[];

  if(uvR>0){
    const uvBelegtTE = gv('uv_fi4')*4 + gv('uv_fi2')*2 + gv('uv_b16_1p')*1 + gv('uv_b16_3p')*3 + gv('uv_b32_3p')*3 + gv('uv_rcbo')*1;
    const uvAnzahlSchienen = Math.max(1, Math.ceil(uvBelegtTE / 12));
    const uvGesamtTE = uvAnzahlSchienen * 12;
    const uvFreieTE = Math.max(0, uvGesamtTE - uvBelegtTE);
    uvAuto.push(`${uvAnzahlSchienen}x Phasenschiene 3-Phasen (12TE)`);
    uvAuto.push(`${uvAnzahlSchienen*2}x Endkappen für Phasenschienen`);
    uvAuto.push(`1x Set Bezeichnungsstreifen / Beschriftung`);
    if(uvFreieTE > 0) uvAuto.push(`${uvFreieTE}x Berührungsschutzkappen für Phasenschiene (${uvBelegtTE} von ${uvGesamtTE} TE belegt, ${uvFreieTE} TE frei)`);
    const uvSumme = gv('uv_fi4')+gv('uv_fi2')+gv('uv_b16_1p')+gv('uv_b16_3p')+gv('uv_b32_3p')+gv('uv_rcbo')+gv('uv_c_typ');
    if(uvSumme>5) uvAuto.push(`1x Verdrahtungssatz H07V-K 10mm² (Etage)`);
  }
  if(zvP>0){
    zvAuto.push(`${zvP}x Zählerverdrahtungssatz [passend zur SLS-Stärke]`);
    zvAuto.push(`1x Set Plombiermaterial (Kappen/Draht)`);
    if(zvS!=='Kein') zvAuto.push(`${zvP}x SLS-Schalter 3-polig [Stärke: ${zvS}]`);
    if(zvR>0){
      const zvBelegtTE = gv('zv_fi4')*4 + gv('zv_fi2')*2 + gv('zv_b16_1p')*1 + gv('zv_b16_3p')*3 + gv('zv_rcbo')*1;
      const zvAnzahlSchienen = Math.max(1, Math.ceil(zvBelegtTE / 12));
      const zvGesamtTE = zvAnzahlSchienen * 12;
      const zvFreieTE = Math.max(0, zvGesamtTE - zvBelegtTE);
      zvAuto.push(`${zvAnzahlSchienen}x Phasenschiene 3-Phasen für ZV-Verteilerfeld`);
      zvAuto.push(`${zvAnzahlSchienen*2}x Endkappen für ZV-Phasenschienen`);
      if(zvFreieTE > 0) zvAuto.push(`${zvFreieTE}x Berührungsschutzkappen für ZV-Phasenschiene (${zvBelegtTE} von ${zvGesamtTE} TE belegt, ${zvFreieTE} TE frei)`);
      const sum2 = gv('zv_fi4')+gv('zv_fi2')+gv('zv_b16_1p')+gv('zv_b16_3p')+gv('zv_rcbo')+gv('zv_c_typ');
      if(sum2>3) zvAuto.push(`1x Verdrahtungsmaterial H07V-K ${zvS==='63A'?'16':'10'}mm² für Haustechnikfeld${zvS==='63A'?' (wegen SLS 63A notwendig!)':''}`);
    }
  }

  let t = `=================================\n`;
  t += `  MATERIALERFASSUNG VERTEILER    \n`;
  t += `=================================\n\n`;
  t += `[STAMMDATEN]\n`;
  t += `- Datum:          ${datum}\n`;
  t += `- Auftragsnummer: ${an || '–'}\n`;
  t += `- Monteur:        ${monteur || '–'}\n`;
  t += `- Straße:         ${strasse || '–'}\n`;
  t += `- Stadt:          ${stadt || '–'}\n`;
  t += `\n---------------------------------\n\n`;

  const fotos = filesUV.length + filesZV.length;
  if(fotos>0){
    t += `⚠️ HINWEIS: Es wurden ${fotos} Fotos erfasst!\n`;
    t += `Bitte hänge die heruntergeladenen Fotos an diese E-Mail an.\n\n`;
  }

  if(uvR>0){
    t += `[UNTERVERTEILUNG (UV) – ETAGE]\n`;
    t += `- Gehäuse-Größe: ${uvR}-reihig\n`;
    const uvFelder = [
      ['uv_haupt','Hauptschalter UV'],['uv_spd','Überspannungsschutz Typ 2'],
      ['uv_fi4','FI-Schutzschalter 4-pol'],['uv_fi2','FI-Schutzschalter 2-pol'],
      ['uv_rcbo','FI/LS Kombischalter'],['uv_b16_1p','LS-Schalter B16 (1-pol)'],
      ['uv_b16_3p','LS-Schalter B16 (3-pol/Herd)'],['uv_b32_3p','LS-Schalter B32 (3-pol)'],
      ['uv_c_typ','LS-Schalter C-Typ (Träge)'],['uv_eltako','Stromstoßschalter/Eltako'],
      ['uv_treppen','Treppenlicht-Zeitschalter']
    ];
    uvFelder.forEach(([id,lbl])=>{ const v=gv(id); if(v>0) t+=`- ${lbl}: ${v} Stk.\n`; });
    if(uvAuto.length){ t+=`\n* Automatisch kalkuliertes UV-Zubehör:\n`; uvAuto.forEach(i=>t+=`  + ${i}\n`); }
    t+=`\n---------------------------------\n\n`;
  }

  if(zvP>0){
    t += `[ZÄHLERVERTEILUNG (ZV) – KELLER/ZENTRALE]\n`;
    t += `- Zählerplätze im Schrank: ${zvP}\n`;
    t += `- SLS-Vorsicherung: ${zvS}\n`;
    const zvM=[['zv_spd','Kombi-Ableiter (SPD Typ 1+2)'],['zv_haupt','Hauptschalter ZV']];
    zvM.forEach(([id,lbl])=>{ const v=gv(id); if(v>0) t+=`- ${lbl}: ${v} Stk.\n`; });
    if(zvR>0){
      t+=`\n[ZV-Sicherungsfeld]\n`;
      t+=`- Verteilerfeld-Größe: ${zvR}-reihig\n`;
      const zvF=[
        ['zv_fi4','ZV-FI-Schutzschalter 4-pol'],['zv_fi2','ZV-FI-Schutzschalter 2-pol'],
        ['zv_rcbo','ZV-FI/LS Kombischalter'],['zv_b16_1p','ZV-LS-Schalter B16 (1-pol)'],
        ['zv_b16_3p','ZV-LS-Schalter B16 (3-pol)'],['zv_c_typ','ZV-LS-Schalter C-Typ'],
        ['zv_eltako','ZV-Stromstoß-/Treppenlichtschalter']
      ];
      zvF.forEach(([id,lbl])=>{ const v=gv(id); if(v>0) t+=`- ${lbl}: ${v} Stk.\n`; });
    }
    if(zvAuto.length){ t+=`\n* Automatisch kalkuliertes ZV-Zubehör:\n`; zvAuto.forEach(i=>t+=`  + ${i}\n`); }
  }

  if(notizen.trim()){
    t += `\n---------------------------------\n`;
    t += `[NOTIZEN]\n${notizen}\n`;
  }

  document.getElementById('email_output').textContent = t;
  const betreff = `Materialliste Verteiler – ANR: ${an||'?'} – ${strasse||'?'}, ${stadt||'?'}`;
  document.getElementById('btn_senden').href = `mailto:${email}?subject=${encodeURIComponent(betreff)}&body=${encodeURIComponent(t)}`;
}

buildRows('uv_rows', FELDER.uv);
buildRows('zv_rows_main', FELDER.zv_main);
buildRows('zv_rows_field', FELDER.zv_field);

// Datum automatisch setzen
const heute = new Date();
const datumStr = heute.toLocaleDateString('de-DE', {weekday:'long', year:'numeric', month:'2-digit', day:'2-digit'});
document.getElementById('datum_anzeige').textContent = datumStr;

aktualisiere();
